[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reinsurance-analytics"
version = "1.0.0"
description = "Actuarial Reinsurance Analytics: Experience Studies, Credibility Theory, Extreme Value Theory, Treaty Layering, and Stochastic Risk Simulation"
authors = [
    { name = "Actuarial Data Science Team", email = "actuarial@reinsurance-analytics.org" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "actuarial",
    "reinsurance",
    "experience-study",
    "credibility-theory",
    "buhlmann-straub",
    "extreme-value-theory",
    "panjer-recursion",
    "risk-theory",
    "tvar",
    "var",
    "glm"
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "openpyxl>=3.1.0",
    "tabulate>=0.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0"
]

[project.scripts]
reinsurx = "reinsurance_analytics.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
